<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accent Line Gradients -->
    <linearGradient id="line-down" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="line-split-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="line-split-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="line-split-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
    <filter id="glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f43f5e" flood-opacity="0.35" />
    </filter>
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #ffffff; }
    .subtitle { font-weight: 400; fill: #94a3b8; font-size: 12px; }
    .badge-text { font-weight: 600; font-size: 11px; }
    .tag { font-size: 11px; font-weight: 500; fill: #cbd5e1; }
    .meta-text { font-size: 12px; font-weight: 500; fill: #64748b; }
    .pulse-dot { animation: pulse 2s infinite; }
  </style>

  <!-- Canvas Outer Background -->
  <rect width="900" height="500" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5" />

  <!-- Subtle Grid Pattern in background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="900" y2="100" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="0" y1="300" x2="900" y2="300" />
    <line x1="0" y1="400" x2="900" y2="400" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="750" y1="0" x2="750" y2="500" />
  </g>

  <!-- Connecting Lines (Background layer for clean overlap) -->
  <!-- Boss -> Manager -->
  <line x1="450" y1="105" x2="450" y2="165" stroke="url(#line-down)" stroke-width="2.5" stroke-dasharray="4 4" />
  <circle cx="450" cy="135" r="3" fill="#38bdf8" />
  <text x="462" y="139" class="font-sans meta-text" fill="#94a3b8">Brief &amp; Gate</text>

  <!-- Manager -> Tiers (Forking paths) -->
  <!-- Left Fork -->
  <path d="M 450 255 L 450 280 Q 450 295 435 295 L 175 295 Q 160 295 160 310 L 160 330"
        fill="none" stroke="url(#line-split-left)" stroke-width="2" />
  <!-- Middle Fork -->
  <line x1="450" y1="255" x2="450" y2="330" stroke="url(#line-split-mid)" stroke-width="2" />
  <!-- Right Fork -->
  <path d="M 450 255 L 450 280 Q 450 295 465 295 L 725 295 Q 740 295 740 310 L 740 330"
        fill="none" stroke="url(#line-split-right)" stroke-width="2" />

  <!-- ==================== 1. BOSS NODE ==================== -->
  <g transform="translate(300, 35)" filter="url(#glow-purple)">
    <rect width="300" height="70" rx="12" fill="url(#card-grad)" stroke="#6366f1" stroke-width="1.8" />
    <rect x="12" y="14" width="42" height="42" rx="8" fill="#4338ca" />
    <text x="33" y="41" font-size="22" text-anchor="middle">👔</text>

    <text x="66" y="34" class="font-sans title" font-size="16">Boss (Main Session)</text>
    <text x="66" y="52" class="font-sans subtitle">Strategic Brief • Final Quality Gate</text>

    <rect x="215" y="12" width="72" height="20" rx="10" fill="#312e81" stroke="#6366f1" stroke-width="1" />
    <text x="251" y="26" class="font-sans badge-text" fill="#c7d2fe" text-anchor="middle">Top Level</text>
  </g>

  <!-- ==================== 2. MANAGER NODE ==================== -->
  <g transform="translate(260, 165)" filter="url(#glow-blue)">
    <rect width="380" height="90" rx="12" fill="url(#card-grad)" stroke="#0ea5e9" stroke-width="1.8" />
    <rect x="14" y="24" width="42" height="42" rx="8" fill="#0369a1" />
    <text x="35" y="51" font-size="22" text-anchor="middle">📋</text>

    <text x="68" y="38" class="font-sans title" font-size="16">boss-manager (Subagent)</text>
    <text x="68" y="56" class="font-sans subtitle">Model: Balanced Reasoning (e.g. GLM / Sonnet)</text>
    <text x="68" y="74" class="font-sans subtitle" fill="#38bdf8">DAG Planning • Tier Assignment • Code Review &amp; Rework</text>

    <rect x="290" y="12" width="76" height="20" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
    <text x="328" y="26" class="font-sans badge-text" fill="#bae6fd" text-anchor="middle">Dispatcher</text>
  </g>

  <!-- ==================== 3. EMPLOYEE TIERS ==================== -->

  <!-- Tier 1: Fast (80% workload) -->
  <g transform="translate(45, 330)" filter="url(#glow-green)">
    <rect width="230" height="135" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.8" />

    <!-- Header -->
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#065f46" />
    <text x="26" y="32" font-size="16" text-anchor="middle">⚡</text>
    <text x="48" y="25" class="font-sans title" font-size="14">Fast Tier</text>
    <text x="48" y="38" class="font-sans subtitle" font-size="11">boss-employee-efficient</text>

    <!-- Pill: 80% Workload -->
    <rect x="145" y="12" width="74" height="20" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1" />
    <text x="182" y="26" class="font-sans badge-text" fill="#6ee7b7" text-anchor="middle">~80% Work</text>

    <!-- Specs -->
    <text x="14" y="68" class="font-sans tag">💰 Model: Lightweight / Sub</text>
    <text x="14" y="86" class="font-sans tag">⚡ Concurrency: High (8 slots)</text>
    <line x1="14" y1="96" x2="216" y2="96" stroke="#334155" stroke-width="1" />
    <text x="14" y="114" class="font-sans subtitle" font-size="10.5" fill="#94a3b8">Grep, read, scoped edits, format, tests</text>
  </g>

  <!-- Tier 2: Mid (15% workload) -->
  <g transform="translate(335, 330)" filter="url(#glow-blue)">
    <rect width="230" height="135" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.8" />

    <!-- Header -->
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#075985" />
    <text x="26" y="32" font-size="16" text-anchor="middle">🔧</text>
    <text x="48" y="25" class="font-sans title" font-size="14">Mid Tier</text>
    <text x="48" y="38" class="font-sans subtitle" font-size="11">boss-employee-default</text>

    <!-- Pill: 15% Workload -->
    <rect x="145" y="12" width="74" height="20" rx="10" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
    <text x="182" y="26" class="font-sans badge-text" fill="#7dd3fc" text-anchor="middle">~15% Work</text>

    <!-- Specs -->
    <text x="14" y="68" class="font-sans tag">⚖️ Model: Balanced Engineering</text>
    <text x="14" y="86" class="font-sans tag">⚡ Concurrency: Medium (6 slots)</text>
    <line x1="14" y1="96" x2="216" y2="96" stroke="#334155" stroke-width="1" />
    <text x="14" y="114" class="font-sans subtitle" font-size="10.5" fill="#94a3b8">Normal feature logic, unit test suites</text>
  </g>

  <!-- Tier 3: Hard (5% workload) -->
  <g transform="translate(625, 330)" filter="url(#glow-rose)">
    <rect width="230" height="135" rx="12" fill="url(#card-grad)" stroke="#f43f5e" stroke-width="1.8" />

    <!-- Header -->
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#881337" />
    <text x="26" y="32" font-size="16" text-anchor="middle">🧠</text>
    <text x="48" y="25" class="font-sans title" font-size="14">Hard Tier</text>
    <text x="48" y="38" class="font-sans subtitle" font-size="11">boss-employee-advanced</text>

    <!-- Pill: 5% Workload -->
    <rect x="148" y="12" width="71" height="20" rx="10" fill="#4c0519" stroke="#fb7185" stroke-width="1" />
    <text x="183" y="26" class="font-sans badge-text" fill="#fda4af" text-anchor="middle">~5% Hard</text>

    <!-- Specs -->
    <text x="14" y="68" class="font-sans tag">💎 Model: Flagship (Opus/Step5)</text>
    <text x="14" y="86" class="font-sans tag">🔒 Concurrency: Capped (≤ 3 slots)</text>
    <line x1="14" y1="96" x2="216" y2="96" stroke="#334155" stroke-width="1" />
    <text x="14" y="114" class="font-sans subtitle" font-size="10.5" fill="#94a3b8">Concurrency locks, security, core arch</text>
  </g>

  <!-- Bottom Value Callout -->
  <g transform="translate(45, 478)">
    <text x="405" y="12" class="font-sans badge-text" fill="#64748b" text-anchor="middle">
      ✨ 60%–80% Token Savings • Rate-Limit Immune (maxConcurrent ≤ 3) • Automated Verification &amp; Rework
    </text>
  </g>
</svg>
